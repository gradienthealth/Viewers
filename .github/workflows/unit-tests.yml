name: Unit Tests

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn

      - run: yarn install --frozen-lockfile
        env:
          # Jest does not use Cypress, so skip downloading its binary.
          CYPRESS_INSTALL_BINARY: 0

      - run: npx jest --ci
