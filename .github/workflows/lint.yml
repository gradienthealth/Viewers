name: Lint

on:
  pull_request:
    branches: [production]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn

      - run: yarn install --frozen-lockfile
        env:
          # ESLint does not use Cypress, so skip downloading its binary.
          CYPRESS_INSTALL_BINARY: 0

      # Only the files a pull request adds or modifies are linted: the code
      # inherited from upstream OHIF has never passed ESLint, and rewriting it
      # wholesale would conflict with later upstream syncs.
      - name: List changed files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only --diff-filter=d "$BASE_SHA"...HEAD \
            -- '*.js' '*.jsx' '*.ts' '*.tsx' > changed-files.txt
          cat changed-files.txt
          echo "count=$(wc -l < changed-files.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Lint changed files
        if: steps.changed.outputs.count != '0'
        run: tr '\n' '\0' < changed-files.txt | xargs -0 yarn lint --no-error-on-unmatched-pattern
