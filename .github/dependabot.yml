version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # The org pr-title check requires a Linear issue ID or NO-ISSUE.
    commit-message:
      prefix: NO-ISSUE
    groups:
      actions-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # The org pr-title check requires a Linear issue ID or NO-ISSUE.
    commit-message:
      prefix: NO-ISSUE
    groups:
      npm-minor:
        update-types:
          - minor
          - patch
